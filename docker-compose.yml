services:
  postgres:
    image: postgres:16-alpine
    container_name: junipay-ledger-db
    environment:
      POSTGRES_USER: junipay
      POSTGRES_PASSWORD: junipay_dev_password
      POSTGRES_DB: junipay_ledger
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/migrations/001_postgres_schema.sql:/docker-entrypoint-initdb.d/001_postgres_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U junipay -d junipay_ledger"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: junipay-ledger-api
    environment:
      DATABASE_URL: postgresql+psycopg://junipay:junipay_dev_password@postgres:5432/junipay_ledger
      DEFAULT_CURRENCY: GHS
      SETTLEMENT_DEFAULT_HOLD_MODE: PENDING
      ALLOW_UNSIGNED_DEV_EVENTS: "true"
      AUTO_SEED_SAMPLE_DATA: "false"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
