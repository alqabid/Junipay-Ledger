services:
  - type: web
    name: junipay-ledger-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: DATABASE_URL
        fromDatabase:
          name: junipay-ledger-db
          property: connectionString
      - key: WEBHOOK_HMAC_SECRET
        generateValue: true
      - key: ALLOW_UNSIGNED_DEV_EVENTS
        value: "true"
      - key: AUTO_SEED_SAMPLE_DATA
        value: "false"
      - key: CORS_ORIGIN_REGEX
        value: "https://.*\\.vercel\\.app"

databases:
  - name: junipay-ledger-db
    plan: free
    databaseName: junipay_ledger
    user: junipay
